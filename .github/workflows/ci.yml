name: CI

on:
  push:
    branches: [main, feature/dpe-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript build check
        run: npx tsc -b --noEmit

      - name: Vitest (unit + integration)
        run: npm run test
        env:
          # Stubs : tests Vitest n'exécutent aucun appel réseau Supabase
          # (env: 'node', les modules supabase sont chargés mais jamais appelés
          # en HTTP). Ces stubs permettent à createClient() de s'instancier
          # sans throw "supabaseUrl is required".
          VITE_SUPABASE_URL: 'https://ci-stub.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'ci-stub-anon-key'

  e2e-smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
